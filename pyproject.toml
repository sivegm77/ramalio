[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramalio"
dynamic = ["version"]
description = "Estándar operativo para workspaces aislados basados en Git worktrees."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ramalio = "ramalio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ramalio.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
